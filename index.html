<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="米金利カレンダー">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>米金利イベントカレンダー</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#667085;--line:#e4e7ec;--accent:#0f172a;--red:#b42318;--redbg:#fef3f2;--orange:#b54708;--orangebg:#fffaeb;--blue:#175cd3;--bluebg:#eff8ff;--green:#067647;--greenbg:#ecfdf3}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:rgba(244,246,248,.94);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid var(--line)}
.header-row{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.appname{font-size:17px;font-weight:750}.status{font-size:11px;color:var(--muted);text-align:right}.status strong{color:var(--green)}
main{max-width:760px;margin:auto;padding:10px 10px calc(82px + env(safe-area-inset-bottom))}.controls{display:grid;grid-template-columns:44px 1fr 44px;gap:7px;align-items:center;margin-bottom:8px}.month{font-size:20px;font-weight:800;text-align:center}
button,select{font:inherit}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;min-height:42px;padding:8px 10px}.btn:active{transform:scale(.98)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.filters select{min-width:0;border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px 8px;font-size:14px}
.today-row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.today-row .btn{font-size:13px;min-height:36px}.legend{font-size:11px;color:var(--muted);white-space:nowrap}
.calendar{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.dow{display:grid;grid-template-columns:repeat(7,1fr);background:#fafafa;border-bottom:1px solid var(--line)}.dow div{text-align:center;font-size:11px;color:var(--muted);padding:7px 0}.dow div:first-child{color:var(--red)}.dow div:last-child{color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}.day{appearance:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;min-height:68px;padding:5px 3px;text-align:left;color:var(--ink);position:relative}.day:nth-child(7n){border-right:0}.day.dim{background:#fafafa;color:#98a2b3}.day.selected{background:#f2f4f7;box-shadow:inset 0 0 0 2px var(--accent)}.day.today .num{background:var(--accent);color:#fff}.num{width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.markers{margin-top:3px;display:flex;flex-direction:column;gap:2px}.marker{height:5px;border-radius:4px;background:#d0d5dd}.m5{background:#d92d20}.m4{background:#f79009}.m3{background:#2e90fa}.more{font-size:9px;color:var(--muted);margin-top:1px;text-align:right}
.section{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.section-title h2{margin:0;font-size:16px}.date-title{font-size:13px;color:var(--muted)}
.event{padding:10px 0;border-top:1px solid var(--line)}.event:first-of-type{border-top:0}.event-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.event-name{font-size:15px;font-weight:750}.time{font-size:13px;white-space:nowrap}.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.tag{font-size:11px;border-radius:999px;padding:3px 7px;background:#f2f4f7;color:#475467}.i5{background:var(--redbg);color:var(--red)}.i4{background:var(--orangebg);color:var(--orange)}.i3{background:var(--bluebg);color:var(--blue)}
.analysis{display:grid;grid-template-columns:1fr;gap:6px;margin-top:7px}.impact{font-size:12px;border-radius:9px;padding:8px}.up{background:var(--redbg);color:#7a271a}.down{background:var(--greenbg);color:#05603a}.stock{background:#f2f4f7;color:#344054}.source{font-size:11px;color:var(--muted);margin-top:6px}.source a{color:inherit}.empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}
.note{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.55}.refresh{width:100%;margin-top:9px}.install{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;font-size:13px;line-height:1.55}.install b{display:block;margin-bottom:3px}.small{font-size:11px;color:var(--muted)}
@media(min-width:520px){.day{min-height:86px}.analysis{grid-template-columns:1fr 1fr}.stock{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="header-row"><div class="appname">米金利イベントカレンダー</div><div class="status" id="status">公式日程を確認中…</div></div></header>
<main>
  <div class="controls"><button class="btn" id="prev" aria-label="前の月">‹</button><div class="month" id="month"></div><button class="btn" id="next" aria-label="次の月">›</button></div>
  <div class="filters"><select id="importance"><option value="3">★★★以上</option><option value="4">★★★★以上</option><option value="5">★★★★★のみ</option><option value="1">すべて</option></select><select id="category"><option value="">全カテゴリ</option><option>インフレ</option><option>雇用</option><option>景気</option><option>FRB</option><option>国債</option></select></div>
  <div class="today-row"><button class="btn" id="today">今月へ戻る</button><div class="legend">赤★★★★★　橙★★★★　青★★★</div></div>
  <section class="calendar"><div class="dow"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="grid" id="grid"></div></section>
  <section class="section"><div class="section-title"><h2>選択日のイベント</h2><div class="date-title" id="selectedDate"></div></div><div id="dayEvents"></div></section>
  <section class="section"><div class="section-title"><h2>今月の重要イベント</h2><div class="date-title" id="count"></div></div><div id="monthEvents"></div><button class="btn refresh" id="refresh">最新データを再読み込み</button><div class="note">自動更新データは公式発表元を優先します。市場予想・結果そのものは、この版ではまだ自動取得しません。発表日時は変更される場合があります。</div></section>
  <section class="install"><b>iPhoneでアプリのように使う</b>Safariでこのページを開き、共有ボタン →「ホーム画面に追加」。次回からホーム画面のアイコンで起動できます。<div class="small">GitHub Pages等に置けば、毎日自動更新された日程をそのまま表示します。</div></section>
</main>
<script>
const FALLBACK=[
{id:'bea-pce-20260826',name:'PCE・コアPCE / 個人所得・支出',date:'2026-08-26',time:'21:30',importance:5,category:'インフレ',source:'BEA',url:'https://www.bea.gov/news/schedule',up:'コアPCEや個人消費が予想を上回る',down:'コアPCEが予想を下回り、消費も減速',impact:'金利上昇はSBG・NASDAQ・高PER半導体に逆風。'},
{id:'bea-gdp-20260826',name:'米GDP 2Q 改定値',date:'2026-08-26',time:'21:30',importance:3,category:'景気',source:'BEA',url:'https://www.bea.gov/news/schedule',up:'GDP上方修正・需要が強い',down:'GDP下方修正・景気減速',impact:'強すぎる成長は利下げ後ずれ観測。'},
{id:'bls-jolts-20260901',name:'JOLTS 求人件数',date:'2026-09-01',time:'23:00',importance:3,category:'雇用',source:'BLS',url:'https://www.bls.gov/schedule/news_release/jolts.htm',up:'求人が市場予想より多い',down:'求人減少・労働市場の緩み',impact:'求人増→賃金インフレ懸念→金利上昇要因。'},
{id:'bls-jobs-20260904',name:'米雇用統計',date:'2026-09-04',time:'21:30',importance:5,category:'雇用',source:'BLS',url:'https://www.bls.gov/schedule/news_release/empsit.htm',up:'雇用者数・平均時給が強く、失業率が低下',down:'雇用・賃金鈍化、失業率上昇',impact:'強い雇用はSBG・半導体に金利経由の逆風。'},
{id:'bls-ppi-20260910',name:'米PPI',date:'2026-09-10',time:'21:30',importance:4,category:'インフレ',source:'BLS',url:'https://www.bls.gov/schedule/news_release/ppi.htm',up:'PPI・コアPPIが予想超過',down:'生産者物価が予想を下回る',impact:'翌日のCPIを前に金利が先に動く場合あり。'},
{id:'bls-cpi-20260911',name:'米CPI・コアCPI',date:'2026-09-11',time:'21:30',importance:5,category:'インフレ',source:'BLS',url:'https://www.bls.gov/schedule/news_release/cpi.htm',up:'特にコアCPI前月比が予想超過',down:'コアCPIが予想を下回る',impact:'最重要。上振れなら長期金利↑、SBG・NASDAQ・半導体↓になりやすい。'},
{id:'fomc-20260916',name:'FOMC 政策金利・声明',date:'2026-09-17',time:'03:00',importance:5,category:'FRB',source:'Federal Reserve',url:'https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm',up:'タカ派声明・利下げ後ずれ・SEP上振れ',down:'ハト派声明・利下げ余地を示唆',impact:'米長期金利とNASDAQを大きく動かす。'}
];
let events=FALLBACK, view=new Date(), selected=new Date();
const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function cleanEvent(e){return {...e,importance:Number(e.importance||3),time:e.time||'',category:e.category||'景気',up:e.up||'強い結果・インフレ上振れは金利上昇要因',down:e.down||'弱い結果・インフレ鈍化は金利低下要因',impact:e.impact||'長期金利上昇は高PERグロース株に逆風。'}}
async function loadData(force=false){$('status').textContent='公式日程を確認中…';try{const r=await fetch(`data/events.json?${force?Date.now():'v=1'}`,{cache:force?'no-store':'default'});if(!r.ok)throw new Error();const d=await r.json();if(Array.isArray(d.events)&&d.events.length)events=d.events.map(cleanEvent);const updated=d.updated_at?new Date(d.updated_at):null;$('status').innerHTML=updated?`<strong>自動更新</strong><br>${updated.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`:'<strong>自動更新データ</strong>'; }catch(e){events=FALLBACK;$('status').textContent='内蔵データで表示';}render();}
function filtered(){const imp=+$('importance').value,cat=$('category').value;return events.filter(e=>e.importance>=imp&&(!cat||e.category===cat));}
function render(){renderCal();renderDay();renderMonth();}
function renderCal(){ $('month').textContent=`${view.getFullYear()}年${view.getMonth()+1}月`;const first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());const arr=filtered();$('grid').innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const b=document.createElement('button');b.className='day';if(d.getMonth()!==view.getMonth())b.classList.add('dim');if(iso(d)===iso(new Date()))b.classList.add('today');if(iso(d)===iso(selected))b.classList.add('selected');const es=arr.filter(e=>e.date===iso(d)).sort((a,b)=>b.importance-a.importance);b.innerHTML=`<span class="num">${d.getDate()}</span><span class="markers"></span>`;const m=b.querySelector('.markers');es.slice(0,3).forEach(e=>{const x=document.createElement('span');x.className=`marker m${Math.min(5,e.importance)}`;m.appendChild(x)});if(es.length>3){const x=document.createElement('span');x.className='more';x.textContent=`+${es.length-3}`;m.appendChild(x)}b.addEventListener('click',()=>{selected=d;render()});$('grid').appendChild(b)}}
function eventHtml(e){const stars='★'.repeat(e.importance);return `<article class="event"><div class="event-head"><div class="event-name">${e.name}</div><div class="time">${e.time||'時刻未定'}</div></div><div class="meta"><span class="tag i${e.importance}">${stars}</span><span class="tag">${e.category}</span><span class="tag">${e.source||'公式'}</span></div><div class="analysis"><div class="impact up"><b>金利↑になりやすい</b><br>${e.up}</div><div class="impact down"><b>金利↓になりやすい</b><br>${e.down}</div><div class="impact stock"><b>株への見方</b><br>${e.impact}</div></div>${e.url?`<div class="source"><a href="${e.url}" target="_blank" rel="noopener">公式ソースを開く</a></div>`:''}</article>`}
function renderDay(){const key=iso(selected),es=filtered().filter(e=>e.date===key).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));$('selectedDate').textContent=`${selected.getMonth()+1}/${selected.getDate()} (${['日','月','火','水','木','金','土'][selected.getDay()]})`;$('dayEvents').innerHTML=es.length?es.map(eventHtml).join(''):'<div class="empty">この日の重要イベントはありません</div>'}
function renderMonth(){const ym=`${view.getFullYear()}-${pad(view.getMonth()+1)}`,es=filtered().filter(e=>e.date.startsWith(ym)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('count').textContent=`${es.length}件`;$('monthEvents').innerHTML=es.length?es.map(e=>`<article class="event"><div class="event-head"><div><div class="event-name">${Number(e.date.slice(8))}日　${e.name}</div><div class="meta"><span class="tag i${e.importance}">${'★'.repeat(e.importance)}</span><span class="tag">${e.category}</span></div></div><div class="time">${e.time||''}</div></div></article>`).join(''):'<div class="empty">該当イベントはありません</div>'}
$('prev').addEventListener('click',()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);selected=new Date(view);render()});$('next').addEventListener('click',()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);selected=new Date(view);render()});$('today').addEventListener('click',()=>{view=new Date();selected=new Date();render()});$('importance').addEventListener('change',render);$('category').addEventListener('change',render);$('refresh').addEventListener('click',()=>loadData(true));
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});loadData();
</script>
</body>
</html>
